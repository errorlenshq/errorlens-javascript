name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # npm trusted publishing: npm trusts this workflow, no token is stored
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@^11.5.1   # trusted publishing needs npm 11.5.1+
      - run: npm ci
      - name: Versions match the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in core node browser; do
            pv=$(node -p "require('./packages/$p/package.json').version")
            [ "$pv" = "$v" ] || { echo "packages/$p is $pv, tag is $v"; exit 1; }
          done
          grep -q "\"$v\"" packages/node/src/version.ts && grep -q "VERSION = \"$v\"" packages/browser/src/index.ts
      - run: npm test
      - name: Publish (core first)
        run: |
          for p in core node browser; do
            name=$(node -p "require('./packages/$p/package.json').name")
            if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then echo "$name already published"; continue; fi
            npm publish --workspace "packages/$p" --access public
          done
